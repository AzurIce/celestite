[package]
name = "celestite"
version = "0.1.0"
description = "A markup noting app based on notist"
authors = ["azurice"]
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.lints.clippy]
wildcard_imports = "deny"

[workspace.dependencies]
celestite-buffer = { path = "crates/celestite-buffer" }
celestite-core = { path = "crates/celestite-core" }
notist = { git = "https://github.com/AzurIce/notist.git", rev = "5194d13249b5648a58e327313e6c9d35d8d76b32" }
notist-html = { git = "https://github.com/AzurIce/notist.git", rev = "5194d13249b5648a58e327313e6c9d35d8d76b32" }
serde = "1"
serde_json = "1"
thiserror = "2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "celestite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints]
workspace = true
