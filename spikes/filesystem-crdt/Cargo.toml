[package]
name = "celestite-filesystem-crdt-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the experiment independent from concurrent production work.
[workspace]

[dependencies]
loro = { version = "=1.16.2", default-features = false }
blake3 = "1"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
notify = "8"
