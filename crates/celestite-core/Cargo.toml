[package]
name = "celestite-core"
version = "0.1.0"
edition = "2021"

[dependencies]
cap-std = "4"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
