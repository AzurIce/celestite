[package]
name = "celestite-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
preview = ["dep:notist", "dep:notist-html"]

[dependencies]
loro = { version = "=1.16.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
notist = { path = "../../../notist", optional = true }
notist-html = { path = "../../../notist/crates/notist-html", optional = true }

[dev-dependencies]
futures-lite = "2.6.1"
