[server]
listen = "127.0.0.1:7437"
# Origins of your Web clients. Scheme, host and port must match exactly.
allowed_origins = ["http://localhost:1420", "http://127.0.0.1:1420"]
# Host-only share management; default: first Vault state_dir/management/socket.
# Parent directory is private (0700), socket is 0600.
# management_socket = "./state/notes/management/socket"
# Optional built UI directory, relative to this config file:
# web_dir = "../../web/dist"

[[vaults]]
id = "notes"
name = "笔记"
# Existing directory; relative paths are relative to this config file.
path = "./notes"
# Existing private directory outside all Vaults and web_dir.
# Initialize once with --init-vault notes, then start without that flag.
state_dir = "./state/notes"
read_only = false
# For disposable tests only: remove state_dir and set ephemeral = true.
