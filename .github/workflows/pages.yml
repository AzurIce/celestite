name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout Celestite
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies and WASM tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/.cache/core-target
            web/.cache/wasm-tools
          key: ${{ runner.os }}-pages-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'web/scripts/build-core.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pages-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'web/scripts/build-core.ts') }}-

      - name: Install Web dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Check Web formatting
        run: bun run --cwd web format:check

      - name: Check types
        run: bun run --cwd web typecheck

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run --cwd web build --base "$PAGES_BASE_PATH/"
          mkdir -p web/dist/debug/sync
          cp web/dist/index.html web/dist/debug/sync/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
